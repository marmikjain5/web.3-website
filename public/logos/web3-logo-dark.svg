<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" fill="none">
  <!-- web.3_ pixel font logo - white version for dark backgrounds -->
  
  <!-- "w" pixel letter -->
  <rect x="10" y="20" width="8" height="8" fill="white"/>
  <rect x="10" y="28" width="8" height="8" fill="white"/>
  <rect x="10" y="36" width="8" height="8" fill="white"/>
  <rect x="10" y="44" width="8" height="8" fill="white"/>
  <rect x="10" y="52" width="8" height="8" fill="white"/>
  <rect x="18" y="52" width="8" height="8" fill="white"/>
  <rect x="26" y="44" width="8" height="8" fill="white"/>
  <rect x="26" y="52" width="8" height="8" fill="white"/>
  <rect x="34" y="52" width="8" height="8" fill="white"/>
  <rect x="42" y="44" width="8" height="8" fill="white"/>
  <rect x="42" y="52" width="8" height="8" fill="white"/>
  <rect x="50" y="20" width="8" height="8" fill="white"/>
  <rect x="50" y="28" width="8" height="8" fill="white"/>
  <rect x="50" y="36" width="8" height="8" fill="white"/>
  <rect x="50" y="44" width="8" height="8" fill="white"/>
  <rect x="50" y="52" width="8" height="8" fill="white"/>

  <!-- "e" pixel letter -->
  <rect x="68" y="28" width="8" height="8" fill="white"/>
  <rect x="76" y="20" width="8" height="8" fill="white"/>
  <rect x="84" y="20" width="8" height="8" fill="white"/>
  <rect x="92" y="20" width="8" height="8" fill="white"/>
  <rect x="68" y="36" width="8" height="8" fill="white"/>
  <rect x="76" y="36" width="8" height="8" fill="white"/>
  <rect x="84" y="36" width="8" height="8" fill="white"/>
  <rect x="92" y="36" width="8" height="8" fill="white"/>
  <rect x="68" y="44" width="8" height="8" fill="white"/>
  <rect x="68" y="52" width="8" height="8" fill="white"/>
  <rect x="76" y="52" width="8" height="8" fill="white"/>
  <rect x="84" y="52" width="8" height="8" fill="white"/>
  <rect x="92" y="52" width="8" height="8" fill="white"/>

  <!-- "b" pixel letter -->
  <rect x="110" y="12" width="8" height="8" fill="white"/>
  <rect x="110" y="20" width="8" height="8" fill="white"/>
  <rect x="110" y="28" width="8" height="8" fill="white"/>
  <rect x="110" y="36" width="8" height="8" fill="white"/>
  <rect x="118" y="36" width="8" height="8" fill="white"/>
  <rect x="126" y="36" width="8" height="8" fill="white"/>
  <rect x="134" y="36" width="8" height="8" fill="white"/>
  <rect x="110" y="44" width="8" height="8" fill="white"/>
  <rect x="134" y="44" width="8" height="8" fill="white"/>
  <rect x="110" y="52" width="8" height="8" fill="white"/>
  <rect x="118" y="52" width="8" height="8" fill="white"/>
  <rect x="126" y="52" width="8" height="8" fill="white"/>
  <rect x="134" y="52" width="8" height="8" fill="white"/>

  <!-- "." dot -->
  <rect x="150" y="52" width="8" height="8" fill="white"/>

  <!-- "3" pixel letter -->
  <rect x="166" y="20" width="8" height="8" fill="white"/>
  <rect x="174" y="20" width="8" height="8" fill="white"/>
  <rect x="182" y="20" width="8" height="8" fill="white"/>
  <rect x="190" y="28" width="8" height="8" fill="white"/>
  <rect x="190" y="36" width="8" height="8" fill="white"/>
  <rect x="174" y="36" width="8" height="8" fill="white"/>
  <rect x="182" y="36" width="8" height="8" fill="white"/>
  <rect x="190" y="44" width="8" height="8" fill="white"/>
  <rect x="166" y="52" width="8" height="8" fill="white"/>
  <rect x="174" y="52" width="8" height="8" fill="white"/>
  <rect x="182" y="52" width="8" height="8" fill="white"/>
  <rect x="190" y="52" width="8" height="8" fill="white"/>
  <!-- 3D pixel detail top-right -->
  <rect x="198" y="12" width="8" height="8" fill="white"/>
  <rect x="206" y="12" width="8" height="8" fill="white"/>
  <rect x="206" y="20" width="8" height="8" fill="white"/>

  <!-- "_" red underscore accent -->
  <rect x="214" y="60" width="24" height="10" fill="#FF6001"/>

  <!-- read.write.own tagline -->
  <text x="50" y="100" font-family="'IBM Plex Mono', monospace" font-size="13" fill="rgba(255,255,255,0.7)" letter-spacing="4" text-anchor="middle" textLength="260" lengthAdjust="spacing">read . write . own</text>

  <!-- Icons row: globe | ethereum | blocks -->
  <g transform="translate(10, 112)" opacity="0.7">
    <!-- Globe icon -->
    <circle cx="20" cy="20" r="14" stroke="white" stroke-width="1.5" fill="none"/>
    <ellipse cx="20" cy="20" rx="7" ry="14" stroke="white" stroke-width="1.5" fill="none"/>
    <line x1="6" y1="20" x2="34" y2="20" stroke="white" stroke-width="1.5"/>
    <line x1="8" y1="12" x2="32" y2="12" stroke="white" stroke-width="1"/>
    <line x1="8" y1="28" x2="32" y2="28" stroke="white" stroke-width="1"/>
    
    <!-- Separator -->
    <line x1="46" y1="8" x2="46" y2="32" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    
    <!-- Ethereum diamond -->
    <polygon points="68,6 60,20 68,25 76,20" stroke="white" stroke-width="1.5" fill="none"/>
    <polygon points="68,25 60,20 68,34" stroke="white" stroke-width="1.5" fill="none"/>
    <polygon points="68,25 76,20 68,34" stroke="white" stroke-width="1.5" fill="none"/>
    
    <!-- Separator -->
    <line x1="90" y1="8" x2="90" y2="32" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    
    <!-- Blocks icon -->
    <rect x="100" y="16" width="12" height="12" stroke="white" stroke-width="1.5" fill="none"/>
    <rect x="108" y="10" width="12" height="12" stroke="white" stroke-width="1.5" fill="none"/>
    <rect x="114" y="20" width="12" height="12" stroke="white" stroke-width="1.5" fill="none"/>
  </g>
</svg>

