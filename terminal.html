<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>WEB.3 — Blockchain Collective Terminal</title>
    <meta name="description"
        content="Register for WEB.3 Blockchain Collective events through our hacker terminal interface." />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace !important;
        }

        #logo {
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 12px !important;
            line-height: 1.4 !important;
            white-space: pre !important;
        }

        body {
            background: #0a0a0a;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0a0a0a;
            pointer-events: none;
        }

        #shell {
            width: 100%;
            max-width: 860px;
            border-radius: 10px;
            overflow: hidden;
            border: 0.5px solid #2c2c2c;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px #1a1a1a;
            position: relative;
            z-index: 1;
        }

        #tbar {
            background: #1d1d1d;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 0.5px solid #2c2c2c;
            user-select: none;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-red {
            background: #ff5f57;
        }

        .dot-yellow {
            background: #ffbd2e;
        }

        .dot-green {
            background: #28ca41;
        }

        .title-bar-label {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #666;
            letter-spacing: 0.05em;
        }

        #term {
            background: #0e0e0e;
            padding: 20px 22px 0;
            height: 75vh;
            overflow-y: auto;
            color: #c8c8c8;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            cursor: text;
        }

        #term::-webkit-scrollbar {
            width: 6px;
        }

        #term::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        #out {
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13.5px;
        }

        #bottom {
            position: sticky;
            bottom: 0;
            background: #0e0e0e;
            padding: 6px 0 14px;
        }

        #hint {
            color: #444;
            font-size: 11px;
            padding: 2px 0 4px;
            font-family: 'Courier New', monospace;
        }

        #irow {
            display: flex;
            align-items: center;
        }

        #pr {
            color: #3fb950;
            white-space: pre;
            flex-shrink: 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        #inp {
            background: transparent;
            border: none;
            outline: none;
            color: #c8c8c8;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            flex: 1;
            caret-color: #3fb950;
            padding: 0;
            width: 100%;
        }

        .green {
            color: #3fb950;
        }

        .blue {
            color: #79c0ff;
        }

        .yellow {
            color: #e3b341;
        }

        .red {
            color: #f97466;
        }

        .muted {
            color: #666;
        }

        .bold {
            font-weight: 700;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            #shell {
                border-radius: 0;
                border: none;
                min-height: 100dvh;
            }

            #term {
                height: 100dvh;
                padding: 12px 10px 0;
                font-size: 12px;
            }

            #pr,
            #inp,
            #hint {
                font-size: 12px;
            }

            pre {
                font-size: 9px;
                overflow-x: auto;
            }

            #out {
                font-size: 12px;
            }

            #bottom {
                padding: 6px 10px 16px;
            }

            #logo {
                font-size: 9px !important;
                line-height: 1.3 !important;
                margin: 8px 0 !important;
                overflow-x: auto !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>
    <div id="shell">
        <div id="tbar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="title-bar-label">WEB.3 — terminal — bash</span>
        </div>

        <div id="term">
            <div id="out"></div>

            <div id="bottom">
                <div id="hint">type 'help' for options</div>
                <div id="irow">
                    <span id="pr">guest@web3:~$ </span>
                    <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
                        spellcheck="false" disabled />
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ─────────────────────────────────────────────
           CONSTANTS
        ───────────────────────────────────────────── */

        const EVENTS = [
            { id: 1, name: 'Blockchain Bootcamp', date: 'May 10, 2025', desc: 'Hands-on intro to blockchain', duration: '3 hours', venue: 'Seminar Hall A' },
            { id: 2, name: 'ZK Proof Workshop', date: 'May 24, 2025', desc: 'Zero-knowledge proofs deep dive', duration: '4 hours', venue: 'Lab Block 2' },
            { id: 3, name: 'Web3 Hackathon', date: 'Jun 7, 2025', desc: '24-hour build challenge', duration: '24 hours', venue: 'Innovation Center' }
        ];

        const IDLE_PROMPT = 'guest@web3:~$\u00a0';

        /* ─────────────────────────────────────────────
           STATE
        ───────────────────────────────────────────── */
        let state = 'idle'; // idle | reg_name | reg_usn | reg_mobile | reg_sem | reg_event | reg_confirm | submitting
        let reg = {};

        /* ─────────────────────────────────────────────
           DOM REFS
        ───────────────────────────────────────────── */
        const output = document.getElementById('out');
        const input = document.getElementById('inp');
        const promptEl = document.getElementById('pr');
        const terminal = document.getElementById('term');

        /* ─────────────────────────────────────────────
           OUTPUT HELPERS
        ───────────────────────────────────────────── */
        function nl(text, cls = '') {
            const span = document.createElement('span');
            if (cls) span.className = cls;
            span.textContent = text + '\n';
            output.appendChild(span);
            scrollBottom();
        }

        function appendHTML(html) {
            const span = document.createElement('span');
            span.innerHTML = html + '\n';
            output.appendChild(span);
            scrollBottom();
        }

        function el() {
            const span = document.createElement('span');
            span.textContent = '\n';
            output.appendChild(span);
            scrollBottom();
        }

        function scrollBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        /* ─────────────────────────────────────────────
           PROMPT / INPUT CONTROL
        ───────────────────────────────────────────── */
        function setPrompt(text) {
            promptEl.textContent = text || IDLE_PROMPT;
        }

        function enableInput(focused = true) {
            input.disabled = false;
            if (focused) input.focus();
        }

        function disableInput() {
            input.disabled = true;
        }

        /* ─────────────────────────────────────────────
           BOOT SEQUENCE
        ───────────────────────────────────────────── */
        const BOOT_LINES = [
            { text: '  [OK] cryptographic modules loaded', cls: 'green' },
            { text: '  [OK] node connected — mainnet', cls: 'green' },
            { text: '  [OK] member registry online', cls: 'green' },
            { text: '' },
            { text: "  Type 'help' for options.", cls: 'muted' },
        ];

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function boot() {
            output.innerHTML = '';
            disableInput();
            setPrompt('');
            const isMobile = window.innerWidth < 600;
            if (isMobile) {
                const small = document.createElement('pre');
                small.id = 'logo';
                small.style.cssText = 'color:#3fb950;';
                small.innerHTML = `<span style="color:#3fb950">██╗    ██╗███████╗██████╗ </span><span style="color:#79c0ff">.3</span>
<span style="color:#3fb950">██║    ██║██╔════╝██╔══██╗</span>
<span style="color:#3fb950">╚██████╔╝███████╗ ██████╔╝</span>`;
                output.appendChild(small);
                playLogoBeep();
                await delay(80);
            } else {
                const logoLines = [
                    `    ██╗    ██╗███████╗██████╗    ██████╗ `,
                    `    ██║    ██║██╔════╝██╔══██╗  ╚════██╗`,
                    `    ██║ █╗ ██║█████╗  ██████╔╝   █████╔╝`,
                    `    ██║███╗██║██╔══╝  ██╔══██╗   ╚═══██╗`,
                    `    ╚███╔███╔╝███████╗██████╔╝██╗██████╔╝`,
                    `     ╚══╝╚══╝ ╚══════╝╚═════╝ ╚═╝╚═════╝ `
                ];

                const logoWrap = document.createElement('pre');
                logoWrap.id = 'logo';
                logoWrap.style.cssText = 'color:#3fb950; margin:10px 0; overflow-x:auto;';
                output.appendChild(logoWrap);

                for (const line of logoLines) {
                    logoWrap.innerHTML += `<span style="color:#3fb950">${line.slice(0, -8)}</span><span style="color:#79c0ff">${line.slice(-8)}</span>\n`;
                    scrollBottom();
                    playLogoBeep();
                    await delay(80);
                }
            }

            let postLogoMargin = document.createElement('div');
            postLogoMargin.style.height = "10px";
            output.appendChild(postLogoMargin);

            for (const line of BOOT_LINES) {
                if (line.html) {
                    appendHTML(line.html);
                } else {
                    nl(line.text, line.cls);
                    if (line.text.includes('[OK]')) playLogoBeep();
                }
                await delay(50);
            }
            playConfirmed();
            afterBoot();
        }

        function afterBoot() {

            setPrompt(IDLE_PROMPT);
            enableInput(true);

            // URL param auto-trigger
            const params = new URLSearchParams(window.location.search);
            if (params.get('register') === '1') {
                setTimeout(startReg, 200);
            }
        }

        /* ─────────────────────────────────────────────
           COMMAND HANDLERS
        ───────────────────────────────────────────── */
        function cmdHelp() {
            el();
            nl('  AVAILABLE COMMANDS');
            nl('  ─────────────────────────────────────────', 'muted');
            const cmds = [
                ['register', 'register for an upcoming event'],
                ['events', 'list all upcoming events'],
                ['about', 'about web.3 collective'],
                ['clear', 'restart terminal from beginning'],
                ['help', 'show this message'],
            ];
            cmds.forEach(([cmd, desc]) => {
                appendHTML(`  <span class="blue">${cmd.padEnd(12)}</span><span class="muted">${desc}</span>`);
            });
            el();
        }

        function cmdEvents() {
            el();
            nl('Upcoming Events', 'green');
            nl('─'.repeat(50), 'muted');
            EVENTS.forEach(ev => {
                appendHTML(
                    `<span class="yellow">[${ev.id}] ${ev.name}</span>  ` +
                    `<span class="muted">${ev.date}</span>\n` +
                    `    <span style="color:#888">${ev.desc}</span>`
                );
            });
            nl('─'.repeat(50), 'muted');
            nl("  Type 'register' to sign up.", 'green');
            el();
        }

        function cmdAbout() {
            el();
            nl('About WEB.3 Blockchain Collective', 'green');
            nl('─'.repeat(50), 'muted');
            nl('WEB.3 is a student-run blockchain club focused on');
            nl('building real-world skills in decentralised systems,');
            nl('zero-knowledge cryptography, and Web3 development.');
            nl('');
            nl('  → Weekly workshops & hackathons', 'blue');
            nl('  → Open to all branches & semesters', 'blue');
            nl('  → Industry mentors & live projects', 'blue');
            nl('─'.repeat(50), 'muted');
            el();
        }

        function cmdClear() {
            boot();
        }

        function cmdUnknown(cmd) {
            nl(`command not found: ${cmd}`, 'red');
            nl("try 'help' for a list of available commands.", 'muted');
        }

        /* ─────────────────────────────────────────────
           REGISTRATION FLOW
        ───────────────────────────────────────────── */
        function startReg() {
            state = 'reg_name';
            reg = {};
            setPrompt(IDLE_PROMPT);
            el();
            nl('Starting registration...', 'green');
            nl('Press Enter after each field. Type \'cancel\' to abort.', 'muted');
            el();
            nl('Full Name:', 'blue');
            enableInput(true);
        }

        function handleRegStep(value) {
            const v = value.trim();

            // Global escape
            if (v.toLowerCase() === 'cancel') {
                nl(`> ${v}`);
                el();
                nl('Registration cancelled.', 'muted');
                resetIdle();
                return;
            }

            switch (state) {
                /* ── Name ── */
                case 'reg_name':
                    nl(`> ${v}`);
                    if (v.length < 2) {
                        nl('✖ Name must be at least 2 characters.', 'red');
                        nl('Full Name:', 'blue');
                        break;
                    }
                    reg.name = v;
                    state = 'reg_usn';
                    el();
                    nl('USN (University Serial Number):', 'blue');
                    break;

                /* ── USN ── */
                case 'reg_usn':
                    nl(`> ${v.toUpperCase()}`);
                    if (v.length < 5) {
                        nl('✖ USN must be at least 5 characters.', 'red');
                        nl('USN:', 'blue');
                        break;
                    }
                    reg.usn = v.toUpperCase();
                    state = 'reg_mobile';
                    el();
                    nl('Mobile Number (10 digits):', 'blue');
                    break;

                /* ── Mobile ── */
                case 'reg_mobile':
                    nl(`> ${v}`);
                    if (!/^\d{10}$/.test(v)) {
                        nl('✖ Enter exactly 10 digits.', 'red');
                        nl('Mobile Number:', 'blue');
                        break;
                    }
                    reg.mobile = v;
                    state = 'reg_sem';
                    el();
                    nl('Semester (1–8):', 'blue');
                    break;

                /* ── Semester ── */
                case 'reg_sem': {
                    nl(`> ${v}`);
                    const sem = parseInt(v, 10);
                    if (!Number.isInteger(sem) || sem < 1 || sem > 8 || String(sem) !== v) {
                        nl('✖ Enter an integer between 1 and 8.', 'red');
                        nl('Semester:', 'blue');
                        break;
                    }
                    reg.semester = sem;
                    state = 'reg_event';
                    el();
                    nl('  SELECT AN EVENT');
                    nl('  ─────────────────────────────────────────', 'muted');
                    EVENTS.forEach(ev => {
                        const padName = ev.name.padEnd(20, ' ');
                        appendHTML(`  <span class="yellow">[${ev.id}]</span>  ${padName} —  <span class="muted">${ev.date}</span>`);
                    });
                    nl('  ─────────────────────────────────────────', 'muted');
                    nl('  Enter 1, 2, or 3:', 'muted');
                    break;
                }

                /* ── Event ── */
                case 'reg_event': {
                    nl(`> ${v}`);
                    const choice = parseInt(v, 10);
                    const evt = EVENTS.find(e => e.id === choice);
                    if (!evt) {
                        nl('✖ Enter 1, 2, or 3.', 'red');
                        nl('Enter 1, 2, or 3:', 'muted');
                        break;
                    }
                    reg.event = evt;
                    state = 'reg_confirm';
                    el();
                    nl('── Registration Summary ──────────────────────', 'muted');
                    nl(`  Name     : ${reg.name}`);
                    nl(`  USN      : ${reg.usn}`);
                    nl(`  Mobile   : ${reg.mobile}`);
                    nl(`  Semester : ${reg.semester}`);
                    nl(`  Event    : ${reg.event.name} (${reg.event.date})`);
                    nl('─────────────────────────────────────────────', 'muted');
                    el();
                    nl("Confirm registration? (y / n)", 'blue');
                    playPrompt();
                    break;
                }

                /* ── Confirm ── */
                case 'reg_confirm':
                    nl(`> ${v}`);
                    if (v.toLowerCase() === 'n') {
                        el();
                        nl('Registration cancelled.', 'muted');
                        resetIdle();
                        break;
                    }
                    if (v.toLowerCase() !== 'y') {
                        nl("✖ Please type 'y' to confirm or 'n' to cancel.", 'red');
                        nl("Confirm? [y/n]", 'blue');
                        break;
                    }
                    // Proceed to submission
                    submitRegistration();
                    break;

                default:
                    break;
            }
        }

        async function submitRegistration() {
            state = 'submitting';
            disableInput();

            const regId = 'WEB3-' + Date.now().toString(36).toUpperCase();
            const firstName = reg.name.split(' ')[0];
            const eventName = reg.event.name;

            el();
            nl('Submitting...', 'muted');
            nl('Broadcasting to registry...', 'muted');

            // Save to localStorage
            try {
                const stored = JSON.parse(localStorage.getItem('web3_regs') || '[]');
                stored.push({
                    id: regId,
                    name: reg.name,
                    usn: reg.usn,
                    mobile: reg.mobile,
                    semester: reg.semester,
                    eventId: reg.event.id,
                    eventName: eventName,
                    timestamp: Date.now(),
                });
                localStorage.setItem('web3_regs', JSON.stringify(stored));
            } catch (_) { /* silently fail */ }

            const msg = `Block confirmed. Welcome to ${reg.event.name}, ${reg.name.split(' ')[0]}.`;

            el();
            nl(msg, 'green');
            el();
            nl(`  REG ID : ${regId}`, 'blue');
            nl('  STATUS : CONFIRMED ✓', 'green');
            playConfirmed();
            nl('─────────────────────────────────────────────', 'muted');
            el();

            resetIdle();
        }

        function resetIdle() {
            state = 'idle';
            reg = {};
            setPrompt(IDLE_PROMPT);
            enableInput(true);
        }

        /* ─────────────────────────────────────────────
           INPUT ROUTER
        ───────────────────────────────────────────── */
        /* ─────────────────────────────────────────────
           TYPING SOUNDS (Web Audio API)
        ───────────────────────────────────────────── */
        let audioCtx = null;

        function getCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playClick() {
            try {
                const ctx = getCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(520, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.12);
            } catch (_) { }
        }

        function playEnter() {
            try {
                const ctx = getCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.18);
            } catch (_) { }
        }

        function playConfirmed() {
            try {
                const ctx = getCtx();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.15);
                    osc.start(ctx.currentTime + i * 0.12);
                    osc.stop(ctx.currentTime + i * 0.12 + 0.15);
                });
            } catch (_) { }
        }

        function playPrompt() {
            try {
                const ctx = getCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(660, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            } catch (_) { }
        }

        function playLogoBeep() {
            try {
                const ctx = getCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.08);
            } catch (_) { }
        }

        input.addEventListener('keydown', (e) => {
            // Play sound on every key
            playClick();
            if (e.key === 'Enter') {
                playEnter();
            }

            if (e.key !== 'Enter') return;

            const raw = input.value;
            const value = raw.trim();
            input.value = '';

            if (state === 'idle') {
                // Echo typed command with prompt
                appendHTML(
                    `<span class="green">${escHtml(IDLE_PROMPT)}</span><span>${escHtml(raw)}</span>`
                );

                switch (value.toLowerCase()) {
                    case 'help': cmdHelp(); break;
                    case 'events': cmdEvents(); break;
                    case 'about': cmdAbout(); break;
                    case 'clear': cmdClear(); break;
                    case 'register': startReg(); break;
                    case '': break;
                    default: cmdUnknown(value); break;
                }
                return;
            }

            if (state === 'submitting') return; // locked

            // Registration steps
            handleRegStep(raw); // pass raw (untrimmed for display, trim inside)
        });

        /* ─────────────────────────────────────────────
           UTILITY
        ───────────────────────────────────────────── */
        function escHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        terminal.addEventListener('click', () => {
            if (!input.disabled) input.focus();
        });

        /* ─────────────────────────────────────────────
           INIT
        ───────────────────────────────────────────── */
        let hasBooted = false;
        function startInitialBoot() {
            if (hasBooted) return;
            hasBooted = true;
            getCtx();
            boot();
        }

        document.addEventListener('click', startInitialBoot, { once: true });
        document.addEventListener('keydown', startInitialBoot, { once: true });
        document.addEventListener('touchstart', startInitialBoot, { once: true });

        disableInput();
        setPrompt('');
        nl('  [ click anywhere to begin ]', 'muted');

        const canvas = document.getElementById('bg');
        const ctx2 = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const isMobileBg = window.innerWidth < 600;
        const PARTICLE_COUNT = isMobileBg ? 20 : 60;
        const PARTICLE_SPEED = isMobileBg ? 0.25 : 0.4;

        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.5,
            dx: (Math.random() - 0.5) * PARTICLE_SPEED,
            dy: (Math.random() - 0.5) * PARTICLE_SPEED,
            opacity: Math.random() * 0.5 + 0.1
        }));

        let animFrame;
        function drawParticles() {
            ctx2.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of particles) {
                ctx2.beginPath();
                ctx2.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx2.fillStyle = `rgba(63, 185, 80, ${p.opacity})`;
                ctx2.fill();
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            }
            animFrame = requestAnimationFrame(drawParticles);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) cancelAnimationFrame(animFrame);
            else drawParticles();
        });

        drawParticles();
    </script>
</body>

</html>
